services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: socdash
      POSTGRES_PASSWORD: dev_change_me
      POSTGRES_DB: socdash
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socdash"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

volumes:
  db_data:
